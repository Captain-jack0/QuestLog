name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # once a day, so a key expiring or being revoked surfaces before the user finds it
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: supabase start
      - name: Point the app at the local stack
        # These are the fixed demo credentials every local `supabase start` prints.
        run: |
          {
            echo "VITE_SUPABASE_URL=$(supabase status -o json | jq -r '.API_URL')"
            echo "VITE_SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')"
          } >> .env.local
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Vercel deploys from the same push; give it a moment, then check the real site the way a
  # visitor would. Catches the failure mode unit tests cannot see: a build that ships without
  # its Supabase credentials, or with a key that has been revoked.
  verify-production:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Wait for the deploy, then verify
        run: |
          sleep 60
          for attempt in 1 2 3 4 5; do
            if node scripts/verify-deploy.mjs; then
              exit 0
            fi
            echo "attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          echo "production check still failing after 5 attempts"
          exit 1
